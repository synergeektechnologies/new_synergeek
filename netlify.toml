[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "https://www.synergeek.in/:splat"
  status = 301
  force = true
  conditions = { Host = ["synergeektechnologies.in", "www.synergeektechnologies.in"] }
